name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      # ---------------------------------------
      # CLEAN OLD BUILDOZER
      # ---------------------------------------

      - name: Clean Buildozer
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf .buildozer

      # ---------------------------------------
      # ANDROID SDK
      # ---------------------------------------

      - name: Install Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools-linux-11076708_latest.zip

          rm commandlinetools-linux-11076708_latest.zip

          mv cmdline-tools latest

          # Buildozer compatibility
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

      # ---------------------------------------
      # ANDROID ENVIRONMENT
      # ---------------------------------------

      - name: Configure Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      # ---------------------------------------
      # SDK PACKAGES
      # ---------------------------------------

      - name: Install SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"

          export PATH="$SDK/tools/bin:$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      # ---------------------------------------
      # CHECK SDKMANAGER
      # ---------------------------------------

      - name: Verify sdkmanager
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          ls -l "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      # ---------------------------------------
      # BUILD APK
      # ---------------------------------------

      - name: Build APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          buildozer android debug log_level=2

      # ---------------------------------------
      # UPLOAD APK
      # ---------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Strategy-Signal-APK
          path: bin/*.apk
