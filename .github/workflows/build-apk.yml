name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Force Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      - name: Install Android SDK
        run: |

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          mkdir -p \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools"

          cd \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q \
            commandlinetools-linux-11076708_latest.zip

          mv cmdline-tools latest

      - name: Setup Android SDK environment
        run: |

          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV

          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

          echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

          echo "$HOME/.buildozer/android/platform/android-sdk/platform-tools" >> $GITHUB_PATH

          echo "$HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Verify Java and SDK
        run: |

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          javac -version

          which java

          which sdkmanager

          sdkmanager --version

      - name: Accept Android licenses
        run: |

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: |

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify AIDL
        run: |

          find \
            "$HOME/.buildozer/android/platform/android-sdk" \
            -name aidl \
            -type f \
            -print

      - name: Build APK
        run: |

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Strategy-Signal-APK
          path: bin/*.apk
