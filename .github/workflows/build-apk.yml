name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Force Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      # ----------------------------------------
      # CLEAN ALL OLD BUILDOZER DATA
      # ----------------------------------------

      - name: Clean Buildozer cache
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf .buildozer

          mkdir -p "$HOME/.buildozer"

          echo "Old Buildozer cache removed."

      # ----------------------------------------
      # ANDROID SDK
      # ----------------------------------------

      - name: Install Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools-linux-11076708_latest.zip

          rm commandlinetools-linux-11076708_latest.zip

          mv cmdline-tools latest

      - name: Setup Android environment
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      # ----------------------------------------
      # ANDROID SDK PACKAGES
      # ----------------------------------------

      - name: Install Android packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      # ----------------------------------------
      # CLEAR NDK VARIABLES
      # ----------------------------------------

      - name: Clear NDK variables
        run: |
          echo "ANDROID_NDK=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=" >> "$GITHUB_ENV"

      # ----------------------------------------
      # CHECK ENVIRONMENT
      # ----------------------------------------

      - name: Check environment
        run: |
          echo "JAVA:"
          java -version

          echo ""
          echo "PYTHON:"
          python --version

          echo ""
          echo "BUILDOZER:"
          buildozer --version

          echo ""
          echo "NDK VARIABLES:"
          env | grep -E '^ANDROID.*NDK' || true

      # ----------------------------------------
      # BUILD APK
      # ----------------------------------------

      - name: Build APK
        env:
          ANDROID_NDK: ""
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROIDNDK: ""
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROIDNDK

          echo "Starting clean Buildozer build..."

          buildozer android debug log_level=2

      # ----------------------------------------
      # UPLOAD APK
      # ----------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Strategy-Signal-APK
          path: bin/*.apk
